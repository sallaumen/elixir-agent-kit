<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">How Elixir Agent Kit works</title>
  <desc id="d">Your project pins the kit as a Mix dependency. The installer writes small references into the project. An agent session follows those references into the dependency and reads one workflow.</desc>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .card-accent { fill: #f3efff; stroke: #7c3aed; stroke-width: 1.5; }
    .h { font: 600 16px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .p { font: 13px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #424a53; }
    .m { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .ms { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .m-accent { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5b21b6; }
    .step { font: 700 12px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .badge { fill: #7c3aed; }
    .arrow { stroke: #7c3aed; stroke-width: 2.5; fill: none; }
    .arrowhead { fill: #7c3aed; }
    .lbl { font: 600 12px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5b21b6; }
    .note { font: 12px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .card-accent { fill: #1f1b33; stroke: #a78bfa; }
      .h { fill: #e6edf3; }
      .p { fill: #9da7b3; }
      .m, .ms { fill: #e6edf3; }
      .m-accent { fill: #c4b5fd; }
      .badge { fill: #8b5cf6; }
      .arrow { stroke: #a78bfa; }
      .arrowhead { fill: #a78bfa; }
      .lbl { fill: #c4b5fd; }
      .note { fill: #8b949e; }
    }
  </style>
  <rect class="bg" width="960" height="400" rx="12"/>

  <!-- 1. Your project -->
  <rect class="card" x="28" y="40" width="270" height="300" rx="12"/>
  <circle class="badge" cx="56" cy="68" r="13"/>
  <text class="step" x="56" y="72.5" text-anchor="middle">1</text>
  <text class="h" x="78" y="73">Your Elixir project</text>
  <text class="p" x="48" y="104">Pin a tag in <tspan class="m">mix.exs</tspan>, like any dep.</text>
  <text class="m" x="48" y="134">{:elixir_agent_kit,</text>
  <text class="m" x="48" y="152">  git: "…/elixir-agent-kit.git",</text>
  <text class="m" x="48" y="170">  tag: "v0.4.0",</text>
  <text class="m" x="48" y="188">  only: [:dev, :test]}</text>
  <text class="p" x="48" y="222">Then:</text>
  <text class="m-accent" x="48" y="244">mix deps.get</text>
  <text class="m-accent" x="48" y="264">mix agent_kit.install</text>
  <text class="note" x="48" y="300">No database, server, model call</text>
  <text class="note" x="48" y="318">or production dependency.</text>

  <path class="arrow" d="M300 190 L352 190"/>
  <polygon class="arrowhead" points="352,184 364,190 352,196"/>
  <text class="lbl" x="332" y="176" text-anchor="middle">writes</text>

  <!-- 2. References -->
  <rect class="card" x="366" y="40" width="262" height="300" rx="12"/>
  <circle class="badge" cx="394" cy="68" r="13"/>
  <text class="step" x="394" y="72.5" text-anchor="middle">2</text>
  <text class="h" x="416" y="73">Small references</text>
  <text class="p" x="386" y="104">Committed with your code:</text>
  <text class="m" x="386" y="130">AGENTS.md</text>
  <text class="note" x="386" y="146">bounded block</text>
  <text class="m" x="386" y="170">CLAUDE.md</text>
  <text class="note" x="386" y="186">block + @AGENTS.md import</text>
  <text class="m" x="386" y="210">.elixir-agent-kit/START.md</text>
  <text class="note" x="386" y="226">index into the dependency</text>
  <text class="ms" x="386" y="250">.claude/skills/elixir-agent-kit</text>
  <text class="ms" x="386" y="266">.agents/skills/elixir-agent-kit</text>
  <text class="note" x="386" y="282">one pointer skill per client</text>
  <text class="note" x="386" y="308">Links only, no copied bodies.</text>
  <text class="note" x="386" y="324">Checksums in state.tsv.</text>

  <path class="arrow" d="M630 190 L682 190"/>
  <polygon class="arrowhead" points="682,184 694,190 682,196"/>
  <text class="lbl" x="662" y="176" text-anchor="middle">follows</text>

  <!-- 3. Agent session -->
  <rect class="card-accent" x="696" y="40" width="236" height="300" rx="12"/>
  <circle class="badge" cx="724" cy="68" r="13"/>
  <text class="step" x="724" y="72.5" text-anchor="middle">3</text>
  <text class="h" x="746" y="73">An agent session</text>
  <text class="p" x="716" y="104">Codex, Claude Code or any</text>
  <text class="p" x="716" y="122">harness that reads files.</text>
  <text class="m" x="716" y="150">deps/elixir_agent_kit/…</text>
  <text class="m" x="716" y="170">  CONTRACT.md</text>
  <text class="note" x="822" y="170">shared rules</text>
  <text class="m" x="716" y="190">  ROUTING.md</text>
  <text class="note" x="822" y="190">pick one area</text>
  <text class="m" x="716" y="210">  skills/async-state/</text>
  <text class="note" x="716" y="228">one workflow: inputs, decisions,</text>
  <text class="note" x="716" y="244">quality criteria, validation.</text>
  <text class="p" x="716" y="278">Same text for every agent,</text>
  <text class="p" x="716" y="296">checkout and version.</text>
  <text class="m-accent" x="716" y="326">mix agent_kit.check  # CI</text>

  <text class="note" x="480" y="376" text-anchor="middle">The library is the dependency. The project keeps references; agents read the source.</text>
</svg>
